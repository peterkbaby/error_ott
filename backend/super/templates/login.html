{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
    {% if user.is_authenticated %}
    <h2 class="text-center">Logged in as {{ user.username }}</h2>
    {% else %}
        <h2 class="text-center">Login</h2>
    </div>
</div>
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" class="form-control" id="username" style="opacity: 0.7;">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" class="form-control" id="password" style="opacity: 0.7;">
            </div>
            <div class="mt-5">
            <button type="submit" class="btn btn-primary btn-block " style="opacity: 0.7;">Login</button>
        </div>
        </form>
        <hr>
        <div class="text-center">
       
        </div>
    </div>
    {% endif %}
</div>

{% endblock %}
