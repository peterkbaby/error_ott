{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h2>Create new Plan</h2>
    </div>
</div>
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="planname">Plan Name</label>
                <input type="planname" name="planname" class="form-control" id="planname" required>
            </div>
            <div class="form-group">
                <label for="details">Details</label>
                <textarea name="details" class="form-control" id="details"></textarea>
            </div>
            <div class="form-group">
                <label for="plan_price">Price</label>
                <input type="plan_price" name="plan_price" class="form-control" id="plan_price" required>
            </div>


            <div class="form-group">
                <label for="validity">Validity (in days)</label>
                <input type="validity" name="validity" class="form-control" id="validity" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Save</button>
        </form>
    </div>
</div>
{% endblock %}
